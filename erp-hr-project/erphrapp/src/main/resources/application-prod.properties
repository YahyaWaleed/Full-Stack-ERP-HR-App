# production: no defaults for anything environment-specific -- startup fails if a variable is missing

spring.datasource.url=${DB_URL}
# use a least-privilege account here, not root
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

# schema + reference data only; the demo data in db/demo is never loaded
spring.flyway.locations=classpath:db/migration

server.compression.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
