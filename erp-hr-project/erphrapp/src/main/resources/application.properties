# shared by every profile; environment-specific values live in application-dev / application-prod
# dev is the default -- production starts with SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=dev
spring.application.name=erphrapp

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# MySQLDialect that treats integer widths and CHAR/VARCHAR as compatible during validation (see the class comment)
spring.jpa.properties.hibernate.dialect=com.yahya.erphrapp.config.ErpMySqlDialect
spring.jpa.open-in-view=false

# Flyway owns the schema; Hibernate only checks that the entities still match it and refuses to start if they drift
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
# BCrypt hash for the first 'admin' login, inserted by V2__seed_reference_data.sql (see README)
spring.flyway.placeholders.admin_password_hash=${ADMIN_PASSWORD_HASH}

# set up for JWT authentication
# secret key is used in verifying authentication token
jwt.secret=${JWT_SECRET}
# access tokens live 15 minutes; the session continues through the refresh token (cookie)
jwt.expiration=900000
app.auth.refresh-token-days=7
# refresh cookie is Secure (HTTPS only) except in dev, where the API runs on plain http://localhost
app.auth.cookie-secure=true
# login lockout: 5 failures within 15 minutes locks that username for 15 minutes
app.auth.login.max-attempts=5
app.auth.login.window-minutes=15
app.auth.login.lock-minutes=15

# comma-separated list of frontend origins allowed to call the API
app.cors.allowed-origins=${APP_CORS_ORIGINS}

# gzip JSON responses (report payloads can be large)
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
