spring.application.name=erphrapp

# connect to the database
spring.datasource.url=jdbc:mysql://localhost:3306/erp_hr?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# set up for JWT authentication
jwt.secret=${JWT_SECRET}
jwt.expiration=28800000

# expiration is 28800000ms which is 8 hours
# secret key is used in verifying authentication token

spring.jpa.open-in-view=false


