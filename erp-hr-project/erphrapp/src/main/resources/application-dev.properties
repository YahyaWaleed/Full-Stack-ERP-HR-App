# local development: sensible defaults, but secrets still come from environment variables

# connect to the database (created automatically on first start)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/erp_hr?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true

# dev also loads the demo employees, payroll runs, etc.
spring.flyway.locations=classpath:db/migration,classpath:db/demo

# Vite dev server ports
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:5175,http://localhost:5179}
